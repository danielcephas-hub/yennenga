# Application en ligne, derrière le proxy Traefik déjà présent sur le serveur (réseau « proxy »).
# Conteneur isolé, ressources plafonnées : il ne gêne pas les autres services de la machine.
services:
  dcb:
    build:
      context: ..
      dockerfile: deploiement/Dockerfile
    image: dcb-repartition:latest
    container_name: dcb-repartition
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./entrepot:/app/data/entrepot   # entrepôt des données (SQLite) : conservé d'une mise à jour à l'autre
    env_file:
      - ./.env                          # DCB_JETON_ADMIN : jeton d'administration, créé sur le serveur, jamais versionné
    cpus: 1.5
    mem_limit: 1500m
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.dcb.rule: Host(`${DCB_HOTE}`)
      traefik.http.routers.dcb.entrypoints: websecure
      traefik.http.routers.dcb.tls: "true"
      traefik.http.routers.dcb.tls.certresolver: mytlschallenge
      traefik.http.routers.dcb.middlewares: dcb-entetes
      traefik.http.services.dcb.loadbalancer.server.port: "8000"
      traefik.http.middlewares.dcb-entetes.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.dcb-entetes.headers.stsSeconds: "31536000"
      traefik.http.middlewares.dcb-entetes.headers.referrerPolicy: no-referrer
      # pas d'indexation par les moteurs de recherche
      traefik.http.middlewares.dcb-entetes.headers.customResponseHeaders.X-Robots-Tag: noindex, nofollow

networks:
  proxy:
    external: true
